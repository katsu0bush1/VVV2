function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}

/* 総G: AT/ボーナス/ハラキリ区間を除いた通常時Gの積算 */
function totalG(){var tot=0,mx=0;for(var i=0;i<LOG.length;i++){var e=LOG[i],g=parseInt(e.g)||0;
 if(e.ev==="at"||e.ev==="sat"||e.ev==="hara"||e.ev==="atend"){if(e.ev==="atend"){tot+=mx;mx=0}continue}
 if(g>mx)mx=g}tot+=mx;return tot}

/* ⚠️ 初当たりの数え方（2026-10-27 修正）
   革命RUSH(at)/超革命RUSH(sat) は**革命BN経由**で入るので、BNと一緒に数えると
   1回の初当たりが2回計上される。直撃(BAR揃い)だけは BN を経由しないので足す。
   旧: s.hit = kaku+kessen+at+sat （二重計上）
   新: s.hit = kaku+kessen+barDirect
   ⚠️ そもそも設1=1/476・設6=1/456 で**設定差は4.4%**。5000G・11回(=1/455)でも
      事後分布は一様のまま＝正しく数えてもほぼ動かない。二重計上したときだけ
      設6へ動く（5000G20回で設6 24%/設1 16%）＝危険なだけの信号だった。 */
function stats(){var s={cz:0,czS:0,kaku:0,kessen:0,at:0,sat:0};
 for(var i=0;i<LOG.length;i++){var e=LOG[i];
  if(e.ev==="dorusia"){s.cz++;if(e.res==="s")s.czS++}
  if(e.ev==="kaku")s.kaku++;if(e.ev==="kessen")s.kessen++;if(e.ev==="at")s.at++;if(e.ev==="sat")s.sat++}
 s.hit=s.kaku+s.kessen+(CC.barDirect||0);   /* AT/超ATはBN経由なので数えない */
 s.atAll=s.at+s.sat;                        /* 表示用（AT消化回数） */
 return s}

/* 前兆(規定pt)からの特殊テーブル弱シグナル: 2周期目以降で≤400pt */
function zenPt(){var lo=0,tot=0;
 for(var i=0;i<LOG.length;i++){var e=LOG[i];if(e.ev==="zencho"&&e.cyc>=2&&e.pt){tot++;if(e.pt<=400)lo++}}
 return{lo:lo,tot:tot}}

/* ============================================================ ベイズ推定 ============================================================ */
function estimate(){
 var ll={},i,s,reasons=[],warns=[],hardMin=0,conf=[],used=false;
 for(i=0;i<SETS.length;i++)ll[SETS[i]]=0;
 /* ★2026-10-27 修正: 母数が足りない／観測率が公表値の上限を超えるときは尤度に入れない。
    どちらも最尤が表の上端(設6)に張り付き、設1でも普通に起こる事象で「設定6」と出ていた。
    例) 継続3連のうちドライブ1回=33% は設6の公表値16.7%の2倍＝表のどの設定でも説明できない
    （設1でも3連中1回以上ドライブは15%で起こる）。下振れ側は log(1-p) の差が小さく
    張り付かないので、弾くのは上振れ側だけでよい。 */
 function bino(succ,trials,rates,label,minN){if(!trials)return;
  /* ループ変数は局所に。outer の i/s は他の集計でも使い回されている。 */
  var hi=-Infinity,ii;for(ii=0;ii<SETS.length;ii++)if(rates[SETS[ii]]>hi)hi=rates[SETS[ii]];
  if(trials<(minN||1)){reasons.push(label+" "+succ+"/"+trials+" ※母数"+(minN||1)+"未満→推定に非加算");return}
  /* 「表のどの設定でも説明できない」観測を弾く。単に obs>hi で弾くと 1/10(10%) のような
     ただのブレまで落ちるので、上限+2σ（二項分布の標準偏差）を超えたときだけにする。 */
  var oob=hi*trials+2*Math.sqrt(trials*hi*(1-hi));
  if(succ>oob){reasons.push(label+" "+succ+"/"+trials+" ※公表値の上限"+(hi*100).toFixed(1)+"%を大きく超える→推定に非加算");return}
  used=true;
  for(i=0;i<SETS.length;i++){s=SETS[i];var p=Math.min(.999,Math.max(.001,rates[s]));ll[s]+=succ*Math.log(p)+(trials-succ)*Math.log(1-p);}
  reasons.push(label+" "+succ+"/"+trials);}
 // 初当たり合算
 var tG=totalG(),st=stats();
 /* 0回も情報（最強の低設定証拠）なので st.hit>0 のゲートは外す。 */
 if(tG>=800){used=true;for(i=0;i<SETS.length;i++){s=SETS[i];var p=1/HITX[s];ll[s]+=st.hit*Math.log(p)+(tG-st.hit)*Math.log(1-p);}
  reasons.push("初当たり "+st.hit+"回/"+tG+"G"+(st.hit?" = 1/"+Math.round(tG/st.hit):"")+" ※設定差4%＝ほぼ無情報");}
 // 終了画面（カウンター集計）
 var escN=0;END_FRAMES.forEach(function(f){var n=CC[SCR2CK[f.k]];if(n>0){escN+=n;used=true;
   for(i=0;i<SETS.length;i++){s=SETS[i];ll[s]+=n*Math.log(Math.max(0.4,ENDSCR[f.k][s])/100);}}});
 if(escN)reasons.push("終了画面 "+escN+"回");
 // BAR直撃 / ハラキリ / 規定pt / サブ液晶
 if(CC.barHit>0)bino(CC.barDirect,CC.barHit,SIG_BARDIRECT,"BAR直撃",1);
 var renT=CC.g10+CC.g20+CC.g50+CC.g100+CC.gUlt;
 var drive=CC.g50+CC.g100+CC.gUlt; /* 50G/100G/究極=ハラキリドライブ発生 */
 bino(drive,renT,SIG_HARA,"ハラキリDR",MIN_HARA_REN);
 var zp=zenPt();bino(zp.lo,zp.tot,P400,"規定pt≤400",4);
 var subN=CC.subNone+CC.subHuman;if(subN>0){used=true;
   for(i=0;i<SETS.length;i++){s=SETS[i];ll[s]+=CC.subNone*Math.log(SUBMON.none[s]/100)+CC.subHuman*Math.log(SUBMON.human[s]/100);}
   reasons.push("サブ液晶 無"+CC.subNone+"/有"+CC.subHuman);}
 /* ★終了画面の記録漏れ検出（2026-10-27）。白(デフォ)を押さずに色枠だけ記録すると
    ENDSCR(白=設1で74%/設6で60%)の減点が入らず、**打つほど高設定に偏る**。
    塞ぐのではなく気づけるようにする。 */
 var scrEv=0,scrRec=0;
 for(i=0;i<LOG.length;i++){var _e=LOG[i];
  if(_e.ev==="dorusia"||_e.ev==="kaku"||_e.ev==="kessen"){scrEv++;if(_e.scr)scrRec++;}}
 if(scrEv>=5&&scrRec<scrEv*0.8)
  warns.push("終了画面を "+scrRec+"/"+scrEv+" しか記録していません。白(デフォ)を飛ばすと高設定に偏ります");
 // 確定・示唆（ハード制約）
 if(CC.o666||CC.g66||CC.magi6||CC.rdLiese||CC.e_gold){hardMin=6;conf.push("設6濃厚");}
 else{if(CC.o555||CC.magi5){hardMin=Math.max(hardMin,5);conf.push("設5以上");}
  if(CC.o456||CC.g44||CC.magi4||CC.rdSaki||CC.e_silver){hardMin=Math.max(hardMin,4);conf.push("設4以上");}
  if(CC.g22||CC.e_purple){hardMin=Math.max(hardMin,2);conf.push("設2以上");}}
 for(i=0;i<LOG.length;i++)if(LOG[i].scr2==="photo"){hardMin=Math.max(hardMin,6);conf.push("AT写真→設6");break}
 // softmax + hardマスク
 var mx=-Infinity;for(i=0;i<SETS.length;i++)if(ll[SETS[i]]>mx)mx=ll[SETS[i]];
 var ex={},z=0;for(i=0;i<SETS.length;i++){s=SETS[i];var v=(s<hardMin)?0:Math.exp(ll[s]-mx);ex[s]=v;z+=v;}
 var post={};for(i=0;i<SETS.length;i++){s=SETS[i];post[s]=z?ex[s]/z:1/SETS.length;}
 var best=SETS[0],bp=0,esum=0,ent=0;
 for(i=0;i<SETS.length;i++){s=SETS[i];if(post[s]>bp){bp=post[s];best=s}esum+=s*post[s];if(post[s]>0)ent-=post[s]*Math.log(post[s]);}
 return {post:post,best:best,bestP:bp,exp:esum,used:used,reasons:reasons,warns:warns,hardMin:hardMin,confList:conf};}

    一次情報では「456枚OVER」等は上位AT中の順目・ゾロ目で出る**獲得枚数表示という演出**
    （出現率 設4〜6で約1〜3%／設1・2では出ない）で、獲得枚数そのものではない。
    ATは普通に666枚を超えるので、枚数を正直に入力すると必ず「設6濃厚」に固着していた。
    → 演出を見たときだけ示唆タブのカウンターを押す運用に変更（自動加算はしない）。 */
 if(curEv==="at"||curEv==="sat")inAT=true;if(curEv==="atend")inAT=false;
 LOG.push(e);curEv=null;curG="";curRes=null;curScr=null;curBin=null;curCat=null;curOpt=null;curMai="";curNote="";curCyc=null;curPt=null;curStage=null;save();render()}

function doRst(){if(!rstP){rstP=true;if(rstT)clearTimeout(rstT);rstT=setTimeout(function(){rstP=false;render()},3000);render();return}
 LOG=[];initC();inAT=false;save();rstP=false;render()}

document.getElementById("W").addEventListener("click",function(ev){var el=ev.target;
 for(var i=0;i<6&&el&&el!==this;i++){if(el.dataset){
  if(el.dataset.tab){TAB=el.dataset.tab;render();return}
  if(el.dataset.grp!==undefined){curGroup=(curGroup===el.dataset.grp?null:el.dataset.grp);curEv=null;curRes=null;curScr=null;curBin=null;curMai="";render();return}
  if(el.dataset.ev){curEv=(curEv===el.dataset.ev?null:el.dataset.ev);curGroup=(curEv?(EV2GRP[curEv]||null):curGroup);curRes=null;curScr=null;curBin=null;curCat=null;curOpt=null;curMai="";curCyc=null;curPt=null;curStage=null;render();return}
  if(el.dataset.cyc!==undefined){curCyc=(curCyc===+el.dataset.cyc?null:+el.dataset.cyc);curPt=null;curStage=null;render();return}
  if(el.dataset.pt!==undefined){curPt=(curPt===+el.dataset.pt?null:+el.dataset.pt);render();return}
  if(el.dataset.stage!==undefined){curStage=(curStage===el.dataset.stage?null:el.dataset.stage);render();return}
  if(el.dataset.encat!==undefined){curCat=(curCat===el.dataset.encat?null:el.dataset.encat);curOpt=null;render();return}
  if(el.dataset.enopt!==undefined){curOpt=(curOpt===el.dataset.enopt?null:el.dataset.enopt);render();return}
  if(el.dataset.res!==undefined){curRes=(curRes===el.dataset.res?null:el.dataset.res);render();return}
  if(el.dataset.scr!==undefined){curScr=(curScr===el.dataset.scr?null:el.dataset.scr);render();return}
  if(el.dataset.bin!==undefined){curBin=(curBin===el.dataset.bin?null:el.dataset.bin);render();return}
  if(el.dataset.a==="add"){addEntry();return}
  if(el.dataset.del!==undefined){LOG.splice(parseInt(el.dataset.del),1);save();load();render();return}
  if(el.dataset.tog){COL[el.dataset.tog]=!COL[el.dataset.tog];render();return}
  if(el.dataset.itog){infoCol[el.dataset.itog]=!infoCol[el.dataset.itog];render();return}
  if(el.dataset.ci){CC[el.dataset.ci]++;save();render();return}
  if(el.dataset.cd){if(CC[el.dataset.cd]>0)CC[el.dataset.cd]--;save();render();return}
 }el=el.parentElement}});
document.getElementById("W").addEventListener("input",function(ev){
 if(ev.target.id==="iG")curG=ev.target.value;
 if(ev.target.id==="iN")curNote=ev.target.value;
 if(ev.target.id==="iMai")curMai=ev.target.value});

load();render();
